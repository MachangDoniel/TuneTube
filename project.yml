name: TuneTube
options:
  bundleIdPrefix: com.tunetube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit
    from: 2.0.0

schemes:
  TuneTube:
    build:
      targets: { TuneTube: all }
    run:
      # Local StoreKit products, so purchase/restore is testable without
      # App Store Connect. Remove for a real sandbox build.
      storeKitConfiguration: TuneTube/Resources/TuneTube.storekit

targets:
  TuneTube:
    type: application
    platform: iOS
    sources:
      - path: TuneTube
    dependencies:
      - package: YouTubePlayerKit
    settings:
      base:
        # Dev API host. `localhost` only works in the Simulator — a real device
        # resolves localhost to itself. The Mac's Bonjour name works for both and
        # survives DHCP changes. Point this at your deployed Worker for release.
        API_BASE_URL: http://Doniels-MacBook-Air.local:8799
        PRODUCT_BUNDLE_IDENTIFIER: com.tunetube.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TuneTube/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TuneTube/Resources/TuneTube.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
