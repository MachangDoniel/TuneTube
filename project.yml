name: TuneTube
options:
  bundleIdPrefix: com.tunetube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit
    from: 2.0.0
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.9
  DebugSwift:
    url: https://github.com/DebugSwift/DebugSwift.git
    branch: main

schemes:
  TuneTube:
    build:
      targets: { TuneTube: all }
    run:
      # Local StoreKit products, so purchase/restore is testable without
      # App Store Connect. Remove for a real sandbox build.
      storeKitConfiguration: TuneTube/Resources/TuneTube.storekit

targets:
  TuneTube:
    type: application
    platform: iOS
    sources:
      - path: TuneTube
    dependencies:
      - package: YouTubePlayerKit
      - package: YouTubeKit
      - package: DebugSwift
    settings:
      configs:
        Debug:
          # Dev API host for local testing on Mac/LAN
          API_BASE_URL: http://Doniels-MacBook-Air.local:8799
        Release:
          # Production Cloudflare Worker edge API for TestFlight and App Store
          API_BASE_URL: https://tunetube-api.tunetube-app.workers.dev
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.tunetube.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TuneTube/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TuneTube/Resources/TuneTube.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
